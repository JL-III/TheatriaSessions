# Publishes the plugin jar (containing the public SessionsAPI) to GitHub Packages
# so first-party plugins can depend on it. Mirrors TheatriaTime's publish workflow.
# Trigger: push a v* tag (e.g. `git tag v1.0.0-alpha.6 && git push origin v1.0.0-alpha.6`).
name: Gradle Package
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Publish package
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
