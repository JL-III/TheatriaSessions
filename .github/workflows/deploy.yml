name: Deploy via Pterodactyl API
on:
  pull_request:
    branches:
      - stage
    
permissions:
  contents: read
  packages: read

jobs:
  build-deploy-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: which jq || echo "jq not found"
      - run: ./gradlew shadowJar --no-daemon
        env:
            GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload JAR via signed URL
        run: |
          set -euo pipefail

          FILE=$(ls build/libs/*.jar | head -n1)
          NAME=$(basename "$FILE")

          RESP=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.PTERO_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.PTERO_PANEL }}/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/files/upload?directory=plugins")

          echo "Signed URL response:"
          echo "$RESP"

          URL=$(echo "$RESP" | jq -r '.attributes.url')

          # validate URL
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Failed to extract upload URL"
            exit 1
          fi

          echo "Uploading $NAME to signed URL..."
          code=$(curl -sS --fail-with-body \
            -X PUT \
            -T "$FILE" \
            -H "Content-Type: application/java-archive" \
            -o /tmp/upload_resp.txt \
            -w '%{http_code}' \
            "$URL&filename=$NAME") || {
              echo "Upload failed, server response:"
              cat /tmp/upload_resp.txt
              exit 1
            }

          echo "Upload completed with HTTP status $code"
          cat /tmp/upload_resp.txt

      - name: Restart server
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.PTERO_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"signal":"restart"}' \
            "${{ secrets.PTERO_PANEL }}/api/client/servers/${{ secrets.PTERO_SERVER_ID }}/power"